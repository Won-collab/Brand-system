<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>8-BIT SNAKE — Travelcard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --forest-900: #162f15;
    --forest-800: #1e3e1d;
    --forest-600: #2d5a2b;
    --lime-100:   #e1f5a8;
    --lime-200:   #cce87a;
    --lime-300:   #b3d44f;
    --olive-400:  #95a46a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    height: 100%;
    /* lock body to viewport so background fills notched phones */
    background: var(--forest-900);
  }

  body {
    height: 100dvh;          /* dynamic viewport — accounts for mobile browser chrome */
    background: var(--forest-900);
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Press Start 2P', monospace;
    color: var(--lime-100);
    overflow: hidden;
    user-select: none;
    touch-action: none;      /* prevent scroll/zoom on the page level */
    /* Safe-area padding for notched phones */
    padding-top:    max(8px, env(safe-area-inset-top));
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    padding-left:   max(0px, env(safe-area-inset-left));
    padding-right:  max(0px, env(safe-area-inset-right));
  }

  /* CRT scanlines */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent, transparent 3px,
      rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
    );
    pointer-events: none;
    z-index: 200;
  }

  /* ── WRAPPER ──────────────────────────────────────── */
  .game-wrapper {
    width: 100%;
    max-width: 480px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    gap: 6px;
  }

  /* ── TOP BAR ──────────────────────────────────────── */
  .topbar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
    flex-shrink: 0;
  }

  .title {
    font-size: clamp(11px, 3.5vw, 18px);
    color: var(--lime-200);
    text-shadow: 2px 2px 0 var(--forest-600);
    letter-spacing: 3px;
    animation: flicker 5s infinite;
  }
  @keyframes flicker {
    0%,94%,100% { opacity:1; }
    95% { opacity:.6; }
    96% { opacity:1; }
    97% { opacity:.4; }
    98%,99% { opacity:1; }
  }

  /* Pause button top-right — big tap target */
  .pause-btn {
    background: var(--forest-800);
    border: 2px solid var(--forest-600);
    color: var(--lime-100);
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    min-width: 44px;
    min-height: 44px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    border-radius: 4px;
  }
  .pause-btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 rgba(0,0,0,0.4); }

  /* ── SCOREBAR ─────────────────────────────────────── */
  .scorebar {
    display: flex;
    gap: clamp(16px, 5vw, 28px);
    font-size: clamp(8px, 2.5vw, 10px);
    color: var(--lime-100);
    letter-spacing: 1px;
    flex-shrink: 0;
  }
  .score-val { color: var(--lime-200); }

  /* ── CANVAS ───────────────────────────────────────── */
  /*
   * Canvas logical size is always 400×400px (CELL=20).
   * CSS scales it to fill available space — `image-rendering: pixelated`
   * keeps pixels sharp at any CSS size.
   * Height constraint: dvh minus topbar(~44) scorebar(~28) dpad(~230) gaps/padding(~70).
   */
  .canvas-wrap {
    --avail-w: calc(100vw - 32px);
    --avail-h: calc(100dvh - 372px);            /* leaves room for chrome above and dpad below */
    --sz: min(var(--avail-w), var(--avail-h), 440px);
    width:  var(--sz);
    height: var(--sz);
    flex-shrink: 0;
    position: relative;
    border: 3px solid var(--forest-600);
    box-shadow:
      0 0 0 2px var(--lime-300),
      0 0 24px rgba(179,212,79,0.2),
      inset 0 0 16px rgba(0,0,0,0.5);
  }

  canvas {
    display: block;
    width:  100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }

  /* ── OVERLAY SCREENS ──────────────────────────────── */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(22,47,21,0.92);
    text-align: center;
    padding: 20px;
    cursor: pointer;
  }
  .overlay.hidden { display: none; }

  .overlay h2 {
    font-size: clamp(13px, 3.5vw, 18px);
    color: var(--lime-200);
    text-shadow: 2px 2px 0 var(--forest-600);
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .overlay p {
    font-size: clamp(6px, 1.8vw, 8px);
    color: var(--olive-400);
    line-height: 2.2;
    letter-spacing: 1px;
  }

  .final-score {
    font-size: clamp(9px, 2.8vw, 12px);
    color: var(--lime-100);
  }

  .tap-hint {
    font-size: clamp(6px, 1.8vw, 8px);
    color: var(--olive-400);
    animation: blink 1.6s step-end infinite;
    margin-top: 2px;
  }

  .pixel-btn {
    padding: 14px 22px;
    min-height: 48px;
    background: var(--lime-200);
    color: var(--forest-900);
    border: none;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 2.5vw, 10px);
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--forest-600);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    letter-spacing: 1px;
  }
  .pixel-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--forest-600); }

  /* ── D-PAD ────────────────────────────────────────── */
  .dpad-area {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 100%;
  }

  /* Hide dpad on true pointer devices; show keyboard hint instead */
  @media (hover: hover) and (pointer: fine) {
    .dpad-area { display: none; }
    .kb-hint    { display: block !important; }
  }

  .kb-hint {
    display: none;
    font-size: 7px;
    color: var(--olive-400);
    letter-spacing: 1px;
    text-align: center;
    line-height: 2.2;
    padding-bottom: 4px;
  }

  /* 3×3 grid: up / left-center-right / down */
  .dpad {
    --btn: clamp(60px, 20vw, 76px);
    display: grid;
    grid-template-columns: repeat(3, var(--btn));
    grid-template-rows:    repeat(3, var(--btn));
    gap: 5px;
  }

  .dpad-btn {
    background: var(--forest-800);
    border: 2px solid var(--forest-600);
    color: var(--lime-100);
    font-size: clamp(20px, 6vw, 28px);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.5);
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    cursor: pointer;
    /* no CSS transition — instant feedback feels more responsive */
  }
  .dpad-btn.pressed,
  .dpad-btn:active {
    background: var(--forest-600);
    box-shadow: 0 1px 0 rgba(0,0,0,0.5);
    transform: translateY(3px);
  }

  /* Centre cell: pause */
  .dpad-center {
    background: var(--forest-800);
    border: 2px solid var(--forest-600);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(12px, 3.5vw, 16px);
    color: var(--olive-400);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    box-shadow: 0 4px 0 rgba(0,0,0,0.5);
  }
  .dpad-center:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }

  .dpad-empty { pointer-events: none; }

  /* ── LANDSCAPE LAYOUT ─────────────────────────────── */
  @media (orientation: landscape) and (max-height: 520px) {
    body { flex-direction: row; padding: 8px; }

    .game-wrapper {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      height: 100%;
      gap: 12px;
      padding: 0 8px;
    }

    .topbar { display: none; }  /* save space in landscape */

    /* Canvas takes left column, sized by height */
    .canvas-wrap {
      --avail-h: calc(100dvh - 16px);
      --avail-w: calc(50vw - 20px);
      --sz: min(var(--avail-h), var(--avail-w));
    }

    /* Scorebar + dpad in right column */
    .dpad-area {
      flex-direction: column;
      justify-content: center;
      width: auto;
      height: 100%;
    }

    .scorebar {
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .dpad {
      --btn: clamp(52px, 9vh, 66px);
    }

    .kb-hint { display: none !important; }
  }

  /* ── PIXEL ART SNAKE (start screen decoration) ────── */
  .pixel-snake { display:flex; gap:2px; margin-bottom:4px; }
  .pixel-block {
    width:12px; height:12px;
    background: var(--lime-200);
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.2), inset 2px 2px 0 rgba(255,255,255,.15);
  }
  .pixel-block.food {
    background:#e74c3c;
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.3), inset 2px 2px 0 rgba(255,255,255,.25);
  }
</style>
</head>
<body>

<div class="game-wrapper">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="title">▶ SNAKE ◀</div>
    <button class="pause-btn" id="pauseBtn" aria-label="Pause/Resume">⏸</button>
  </div>

  <!-- SCORE -->
  <div class="scorebar">
    <span>SCORE <span class="score-val" id="score">0</span></span>
    <span>BEST <span class="score-val" id="best">0</span></span>
    <span>LVL <span class="score-val" id="level">1</span></span>
  </div>

  <!-- CANVAS -->
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- Start -->
    <div class="overlay" id="startScreen">
      <div class="pixel-snake">
        <div class="pixel-block"></div>
        <div class="pixel-block"></div>
        <div class="pixel-block"></div>
        <div class="pixel-block food"></div>
      </div>
      <h2>PRESS START</h2>
      <p>EAT THE APPLES<br>DON'T HIT WALLS<br>OR YOURSELF</p>
      <button class="pixel-btn" id="startBtn">START GAME</button>
    </div>

    <!-- Game Over -->
    <div class="overlay hidden" id="gameOverScreen">
      <h2>GAME OVER</h2>
      <div class="final-score">SCORE: <span id="finalScore">0</span></div>
      <div class="final-score" id="newHighMsg" style="color:var(--lime-300);display:none">★ NEW BEST ★</div>
      <button class="pixel-btn" id="restartBtn">TRY AGAIN</button>
      <div class="tap-hint">— TAP ANYWHERE TO RETRY —</div>
    </div>

    <!-- Paused -->
    <div class="overlay hidden" id="pauseScreen">
      <h2>PAUSED</h2>
      <div class="tap-hint">— TAP TO RESUME —</div>
    </div>
  </div>

  <!-- KEYBOARD HINT (desktop only, shown via CSS) -->
  <div class="kb-hint">
    WASD / ARROWS — MOVE &nbsp;|&nbsp; P / SPACE — PAUSE
  </div>

  <!-- D-PAD (touch devices) -->
  <div class="dpad-area">
    <div class="dpad" id="dpad">
      <!-- Row 1 -->
      <div class="dpad-empty"></div>
      <button class="dpad-btn" data-dir="UP"    aria-label="Up">▲</button>
      <div class="dpad-empty"></div>
      <!-- Row 2 -->
      <button class="dpad-btn" data-dir="LEFT"  aria-label="Left">◀</button>
      <div class="dpad-center" id="dpadPause"   aria-label="Pause">⏸</div>
      <button class="dpad-btn" data-dir="RIGHT" aria-label="Right">▶</button>
      <!-- Row 3 -->
      <div class="dpad-empty"></div>
      <button class="dpad-btn" data-dir="DOWN"  aria-label="Down">▼</button>
      <div class="dpad-empty"></div>
    </div>
  </div>

</div>

<script>
// ── Constants ─────────────────────────────────────────────────
// Canvas is always 400×400 logical pixels (20 cols × 20px cell).
// CSS scales the element to fit the screen; image-rendering:pixelated keeps it sharp.
const COLS       = 20;
const ROWS       = 20;
const CELL       = 20;   // logical pixels per cell (never changes)
const BASE_SPEED = 150;
const MIN_SPEED  = 60;

const C = {
  bg:        '#162f15',
  grid:      '#1a3618',
  snakeHead: '#cce87a',
  snakeEye:  '#162f15',
  food:      '#e74c3c',
  foodShine: '#ff8070',
};

// ── Canvas ────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
// canvas.width/height are set in HTML (400/400), never changed

// ── Audio ─────────────────────────────────────────────────────
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function beep(freq, dur, type = 'square', vol = 0.14) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(audioCtx.currentTime);
    o.stop(audioCtx.currentTime + dur);
  } catch (_) {}
}

const sfx = {
  eat:   () => { beep(523,.07); setTimeout(()=>beep(659,.07),60); setTimeout(()=>beep(784,.1),120); },
  die:   () => { beep(200,.1); setTimeout(()=>beep(150,.12),90); setTimeout(()=>beep(100,.2),200); },
  start: () => [262,330,392,523].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*80)),
  pause: () => beep(440,.1,'sine'),
  level: () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.1),i*60)),
};

// ── State ──────────────────────────────────────────────────────
let snake, dir, nextDir, food, score, best, level, speed;
let gameState = 'idle'; // idle | playing | paused | dead
let tickTimer = null;
let rafId     = null;
let foodAnim  = 0;

function initGame() {
  const cx = COLS >> 1, cy = ROWS >> 1;
  snake   = [{ x:cx, y:cy }, { x:cx-1, y:cy }, { x:cx-2, y:cy }];
  dir     = { x:1, y:0 };
  nextDir = { x:1, y:0 };
  score   = 0; level = 1; speed = BASE_SPEED;
  spawnFood();
  updateHUD();
}

function spawnFood() {
  let p;
  do { p = { x: rnd(0, COLS-1), y: rnd(0, ROWS-1) }; }
  while (snake.some(s => s.x === p.x && s.y === p.y));
  food = p;
}

const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

// ── Tick ──────────────────────────────────────────────────────
function startTicker() {
  clearInterval(tickTimer);
  tickTimer = setInterval(tick, speed);
}

function tick() {
  if (gameState !== 'playing') return;
  dir = { ...nextDir };
  const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (h.x < 0 || h.x >= COLS || h.y < 0 || h.y >= ROWS) return die();
  if (snake.some(s => s.x === h.x && s.y === h.y))        return die();

  snake.unshift(h);

  if (h.x === food.x && h.y === food.y) {
    score += 10 * level;
    if (score > best) { best = score; localStorage.setItem('snakeBest', best); }
    sfx.eat();
    spawnFood();
    const nl = Math.floor(score / 50) + 1;
    if (nl > level) { level = nl; speed = Math.max(MIN_SPEED, BASE_SPEED - (level-1)*12); startTicker(); sfx.level(); }
    updateHUD();
  } else {
    snake.pop();
  }
}

function die() {
  gameState = 'dead';
  clearInterval(tickTimer);
  sfx.die();
  setTimeout(showGameOver, 380);
}

// ── Render ────────────────────────────────────────────────────
function render(ts) {
  foodAnim = (Math.sin(ts * 0.004) + 1) / 2;

  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, COLS*CELL, ROWS*CELL);

  // Grid
  ctx.strokeStyle = C.grid;
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, ROWS*CELL); ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(COLS*CELL, i*CELL); ctx.stroke();
  }

  drawFood();
  drawSnake();
  rafId = requestAnimationFrame(render);
}

function drawFood() {
  const px = food.x * CELL, py = food.y * CELL;
  const p  = 2 * foodAnim; // pulse 0–2px

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(px+3, py+4, CELL-4, CELL-4);

  ctx.fillStyle = C.food;
  ctx.fillRect(px+2-p/2, py+3-p/2, CELL-4+p, CELL-4+p);

  ctx.fillStyle = C.foodShine;
  ctx.fillRect(px+4, py+5, 3, 3);

  ctx.fillStyle = '#5d8a3a';
  ctx.fillRect(px+CELL/2-1, py+1, 2, 4);
  ctx.fillStyle = '#7ab84a';
  ctx.fillRect(px+CELL/2+1, py+1, 3, 2);
}

function drawSnake() {
  for (let i = snake.length - 1; i >= 0; i--) {
    const { x, y } = snake[i];
    const px = x*CELL, py = y*CELL;
    const isHead = i === 0;
    const t = 1 - i / snake.length;

    ctx.fillStyle = isHead
      ? C.snakeHead
      : `rgb(${lerp(0xcc,0x6b,1-t)|0},${lerp(0xe8,0x94,1-t)|0},${lerp(0x7a,0x32,1-t)|0})`;

    const pad = isHead ? 1 : 2;
    ctx.fillRect(px+pad, py+pad, CELL-pad*2, CELL-pad*2);

    if (!isHead) {
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(px+pad, py+pad, CELL-pad*2, 2);
      ctx.fillRect(px+pad, py+pad, 2, CELL-pad*2);
    } else {
      // Eyes positioned by direction
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      ctx.fillRect(px+1, py+1, CELL-2, CELL-2);
      let e1x, e1y, e2x, e2y;
      if      (dir.x===1)  { e1x=px+CELL-5; e1y=py+4;      e2x=px+CELL-5; e2y=py+CELL-7; }
      else if (dir.x===-1) { e1x=px+3;      e1y=py+4;      e2x=px+3;      e2y=py+CELL-7; }
      else if (dir.y===-1) { e1x=px+4;      e1y=py+3;      e2x=px+CELL-7; e2y=py+3; }
      else                 { e1x=px+4;      e1y=py+CELL-5; e2x=px+CELL-7; e2y=py+CELL-5; }
      ctx.fillStyle = C.snakeEye;
      ctx.fillRect(e1x,e1y,3,3); ctx.fillRect(e2x,e2y,3,3);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(e1x+1,e1y,1,1); ctx.fillRect(e2x+1,e2y,1,1);
    }
  }
}

const lerp = (a, b, t) => a + (b-a) * t;

// ── HUD ───────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent  = best;
  document.getElementById('level').textContent = level;
}

// ── Screens ───────────────────────────────────────────────────
const SCREENS = ['startScreen','gameOverScreen','pauseScreen'];

function showScreen(id) {
  SCREENS.forEach(s => document.getElementById(s).classList.toggle('hidden', s !== id));
}
function hideAll() {
  SCREENS.forEach(s => document.getElementById(s).classList.add('hidden'));
}

function showGameOver() {
  document.getElementById('finalScore').textContent = score;
  document.getElementById('newHighMsg').style.display = (score > 0 && score >= best) ? 'block' : 'none';
  showScreen('gameOverScreen');
}

// ── Direction ─────────────────────────────────────────────────
function setDir(cmd) {
  if (cmd==='UP'    && dir.y===0) nextDir = {x:0,  y:-1};
  if (cmd==='DOWN'  && dir.y===0) nextDir = {x:0,  y:1 };
  if (cmd==='LEFT'  && dir.x===0) nextDir = {x:-1, y:0 };
  if (cmd==='RIGHT' && dir.x===0) nextDir = {x:1,  y:0 };
}

// ── Keyboard ──────────────────────────────────────────────────
const KEY_MAP = {
  ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT',
  w:'UP', s:'DOWN', a:'LEFT', d:'RIGHT',
  W:'UP', S:'DOWN', A:'LEFT', D:'RIGHT',
};

document.addEventListener('keydown', e => {
  if (e.key in KEY_MAP) {
    e.preventDefault();
    ensureAudio();
    if (gameState === 'playing') setDir(KEY_MAP[e.key]);
    else if (gameState === 'idle' || gameState === 'dead') startGame();
  } else if (e.key === 'p' || e.key === 'P' || e.key === ' ') {
    e.preventDefault();
    ensureAudio();
    togglePause();
  }
});

// ── D-pad ─────────────────────────────────────────────────────
document.querySelectorAll('.dpad-btn').forEach(btn => {
  const d = btn.dataset.dir;

  function onPress(e) {
    e.preventDefault();
    ensureAudio();
    btn.classList.add('pressed');
    if (gameState === 'playing') setDir(d);
    else if (gameState === 'idle' || gameState === 'dead') startGame();
  }
  function onRelease() { btn.classList.remove('pressed'); }

  btn.addEventListener('touchstart', onPress,   { passive: false });
  btn.addEventListener('touchend',   onRelease, { passive: true });
  btn.addEventListener('touchcancel',onRelease, { passive: true });
  btn.addEventListener('mousedown',  onPress);
  btn.addEventListener('mouseup',    onRelease);
});

// D-pad centre = pause
function onDpadPause(e) { e.preventDefault(); ensureAudio(); togglePause(); }
document.getElementById('dpadPause').addEventListener('touchstart', onDpadPause, { passive: false });
document.getElementById('dpadPause').addEventListener('mousedown',  onDpadPause);

// Top-right pause button
document.getElementById('pauseBtn').addEventListener('click', () => { ensureAudio(); togglePause(); });

// ── Overlay tap-to-action ─────────────────────────────────────
document.getElementById('pauseScreen').addEventListener('click', () => {
  if (gameState === 'paused') { ensureAudio(); togglePause(); }
});
document.getElementById('gameOverScreen').addEventListener('click', e => {
  if (e.target.id !== 'restartBtn') { ensureAudio(); startGame(); }
});
document.getElementById('startScreen').addEventListener('click', e => {
  if (e.target.id !== 'startBtn') { ensureAudio(); startGame(); }
});

// ── Canvas swipe (secondary control) ─────────────────────────
let swipeStart = null;
canvas.addEventListener('touchstart', e => {
  swipeStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  ensureAudio();
}, { passive: true });
canvas.addEventListener('touchend', e => {
  if (!swipeStart) return;
  const dx = e.changedTouches[0].clientX - swipeStart.x;
  const dy = e.changedTouches[0].clientY - swipeStart.y;
  swipeStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return; // tap, not swipe
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'RIGHT' : 'LEFT');
  else                              setDir(dy > 0 ? 'DOWN'  : 'UP');
}, { passive: true });

// ── Pause ─────────────────────────────────────────────────────
function togglePause() {
  if (gameState === 'playing') {
    gameState = 'paused';
    clearInterval(tickTimer);
    sfx.pause();
    showScreen('pauseScreen');
  } else if (gameState === 'paused') {
    gameState = 'playing';
    sfx.pause();
    hideAll();
    startTicker();
  }
}

// ── Game lifecycle ────────────────────────────────────────────
function startGame() {
  ensureAudio();
  initGame();
  hideAll();
  gameState = 'playing';
  sfx.start();
  startTicker();
}

document.getElementById('startBtn').addEventListener('click',   e => { e.stopPropagation(); startGame(); });
document.getElementById('restartBtn').addEventListener('click', e => { e.stopPropagation(); startGame(); });

// ── Boot ──────────────────────────────────────────────────────
best = parseInt(localStorage.getItem('snakeBest') || '0', 10);
initGame();
showScreen('startScreen');
updateHUD();

cancelAnimationFrame(rafId);
rafId = requestAnimationFrame(render);
</script>
</body>
</html>
